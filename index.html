:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: one-screen phone app. Header, scrolling view, bottom tab bar. Cards tab = stats strip + card stack + answer buttons. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E3E8F0; --ink:#172031; --muted:#5A6479; --line:#D3DAE5;
  --accent:#2447D6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF;
  --mark:#FFE56B; --mark-ink:#172031;
  --yes:#1A9660; --yes-soft:#DDF3E8; --no:#D2432F; --no-soft:#FBE3DF;
  --shadow:0 14px 34px -20px rgba(18,32,70,.55);
  --f-display:"Unbounded", "Onest", system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#172030; --sunk:#111926; --ink:#E7ECF4; --muted:#98A3B7; --line:#2A3548;
  --accent:#86A0FF; --accent-ink:#0E131C; --accent-soft:#1F2B4D;
  --mark:rgba(255,215,64,.26); --mark-ink:#FFE9A3;
  --yes:#3FCB88; --yes-soft:#16302A; --no:#FF7462; --no-soft:#3A1D1D;
  --shadow:0 14px 34px -20px rgba(0,0,0,.9); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#172030; --sunk:#111926; --ink:#E7ECF4; --muted:#98A3B7; --line:#2A3548;
  --accent:#86A0FF; --accent-ink:#0E131C; --accent-soft:#1F2B4D;
  --mark:rgba(255,215,64,.26); --mark-ink:#FFE9A3;
  --yes:#3FCB88; --yes-soft:#16302A; --no:#FF7462; --no-soft:#3A1D1D;
  --shadow:0 14px 34px -20px rgba(0,0,0,.9); color-scheme:dark; }

html{height:100%; box-sizing:border-box} body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
mark{background:var(--mark); color:var(--mark-ink); padding:0 .18em; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.gap{display:inline-block; width:3.2em; border-bottom:2px solid var(--ink); vertical-align:-.1em; margin:0 .1em}

#app{height:100%; max-width:640px; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px 8px}
.brand{font-family:var(--f-display); font-weight:700; font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px}
.brand svg{flex:none}
.sync{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block}
.sync.cloud i{background:var(--yes)}
.iconbtn{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:var(--muted)}
.iconbtn:hover{background:var(--sunk); color:var(--ink)}
.topright{display:flex; align-items:center; gap:4px}

main{overflow:hidden; position:relative; min-height:0}
.view{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch}
.pad{padding:4px 16px 28px}

.tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 16px 10px; border-top:1px solid var(--line); background:var(--bg)}
.tab{height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line)}
.badge{min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700; display:inline-grid; place-items:center; font-variant-numeric:tabular-nums}

/* ---------- topics list ---------- */
.h-sec{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:18px 0 8px}
.tlist{display:flex; flex-direction:column; gap:8px}
.titem{display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; text-align:left; width:100%; padding:12px 14px; border-radius:16px; background:var(--surface); border:1px solid var(--line)}
.titem:hover{border-color:var(--muted)}
.titem.next{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.tnum{font-family:var(--f-display); font-weight:500; font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums}
.tbody{min-width:0}
.tname{font-weight:600; line-height:1.25}
.tsub{font-size:13px; color:var(--muted); line-height:1.3; margin-top:2px}
.tbar{height:4px; border-radius:2px; background:var(--sunk); margin-top:8px; overflow:hidden}
.tbar b{display:block; height:100%; background:var(--accent); border-radius:2px}
.pill{font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px; white-space:nowrap; background:var(--sunk); color:var(--muted)}
.pill.on{background:var(--accent-soft); color:var(--accent)}
.pill.done{background:var(--yes-soft); color:var(--yes)}
.pill.due{background:var(--mark); color:var(--mark-ink)}
.pill.paused{background:transparent; border:1px dashed var(--line)}

/* ---------- topic detail ---------- */
.back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-weight:500; padding:6px 0}
.dhead{margin:6px 0 4px}
.dnum{font-family:var(--f-mono); font-size:12px; color:var(--muted); letter-spacing:.06em}
.dtitle{font-family:var(--f-display); font-weight:700; font-size:clamp(22px,6vw,28px); line-height:1.15; letter-spacing:-.02em; margin:4px 0 6px; text-wrap:balance}
.dsub{color:var(--muted); margin:0}
.intro{margin:14px 0 0; max-width:62ch}
.tlbox{margin:16px 0 4px; padding:10px 12px 6px; background:var(--surface); border:1px solid var(--line); border-radius:16px; display:grid; gap:4px}
.tlcap{font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.04em}
.tl{width:100%; height:auto; display:block; max-width:100%}
.tl .ax{stroke:var(--line); stroke-width:2}
.tl .axh{fill:var(--line)}
.tl .now{stroke:var(--ink); stroke-width:2}
.tl .lab{fill:var(--muted); font:500 10px var(--f-body)}
.tl .labi{fill:var(--ink); font:600 10px var(--f-body)}
.tl .dot{fill:var(--accent)}
.tl .wave{stroke:var(--accent); stroke-width:2.5; fill:none; stroke-linecap:round}
.tl .arr{stroke:var(--accent); stroke-width:2; fill:none; stroke-dasharray:1 0}
.tl .arrh{fill:var(--accent)}
.tl .ref{stroke:var(--muted); stroke-width:1.5; stroke-dasharray:3 3}

.tblwrap{overflow-x:auto; margin:8px 0 4px; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.tblcap{font-weight:600; margin:18px 0 0}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; background:var(--sunk)}
td:first-child{font-weight:600; white-space:nowrap}
.uses{display:grid; gap:10px; margin-top:8px}
.use{padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.use .u{font-weight:600; font-size:14px}
.use .en{margin-top:4px}
.use .be{color:var(--muted); font-size:14px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{font-size:14px; padding:5px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
.mist{display:grid; gap:10px; margin-top:8px}
.mis{padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); display:grid; gap:4px}
.mis .w{color:var(--no); text-decoration:line-through; text-decoration-thickness:1.5px; display:flex; gap:8px; align-items:baseline}
.mis .r{color:var(--ink); display:flex; gap:8px; align-items:baseline}
.mis .why{color:var(--muted); font-size:14px; padding-left:22px}
.mis svg{flex:none; position:relative; top:2px}
.dcards{display:grid; gap:6px; margin-top:8px}
.dcard{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-size:14px}
.dcard .k{font-family:var(--f-mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.meter{display:flex; gap:3px}
.meter i{width:7px; height:7px; border-radius:50%; background:var(--sunk); border:1px solid var(--line)}
.meter i.f{background:var(--accent); border-color:var(--accent)}
.meter.done i.f{background:var(--yes); border-color:var(--yes)}
.actbar{position:sticky; bottom:0; margin:22px -16px -28px; padding:12px 16px 14px; background:linear-gradient(to bottom, transparent, var(--bg) 30%); display:flex; gap:8px; flex-wrap:wrap}
.btn{height:48px; padding:0 18px; border-radius:14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--accent); color:var(--accent-ink); flex:1}
.btn.ghost{background:var(--surface); border:1px solid var(--line)}
.btn.wide{flex:1}

/* ---------- cards ---------- */
.cview{display:flex; flex-direction:column; height:100%; padding:2px 16px 12px}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:7px 8px 6px; min-width:0}
.stat b{display:block; font-family:var(--f-display); font-weight:500; font-size:17px; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.stage{flex:1; position:relative; margin:12px 0 10px; min-height:260px}
.card{position:absolute; inset:0; background:var(--surface); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:18px 18px 16px; display:flex; flex-direction:column; touch-action:pan-y; user-select:none; -webkit-user-select:none; transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; will-change:transform; overflow:hidden}
.card.under{transform:translateY(12px) scale(.955); opacity:.65; box-shadow:none}
.chead{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.kind{font-family:var(--f-mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; padding:4px 8px; border-radius:8px; background:var(--sunk); color:var(--ink)}
.mode{font-size:12px; font-weight:600; color:var(--accent)}
.mode.review{color:var(--yes)}
.ctopic{margin-left:auto; font-size:12px; color:var(--muted); max-width:45%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cbody{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; min-height:0; overflow-y:auto; padding:8px 0}
.prompt{font-size:clamp(20px,5.6vw,25px); line-height:1.35; font-weight:500; text-wrap:pretty}
.card.revealed .prompt{font-size:clamp(17px,4.6vw,20px); color:var(--muted)}
.card.revealed .prompt mark{color:var(--mark-ink)}
.ans{display:none; border-top:1px dashed var(--line); padding-top:14px}
.card.revealed .ans{display:block; animation:rise .22s ease-out}
.ans .a{font-size:clamp(19px,5.2vw,23px); line-height:1.35; font-weight:600}
.ans .n{color:var(--muted); font-size:15px; margin-top:8px}
.cfoot{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--muted)}
.stamp{position:absolute; top:22px; padding:5px 12px; border-radius:10px; border:2.5px solid; font-family:var(--f-display); font-weight:700; font-size:15px; letter-spacing:.04em; opacity:0; pointer-events:none; background:var(--surface)}
.stamp.yes{left:18px; color:var(--yes); transform:rotate(-10deg)}
.stamp.no{right:18px; color:var(--no); transform:rotate(10deg)}
.controls{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.cbtn{height:58px; border-radius:18px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px}
.cbtn.no{background:var(--no-soft); color:var(--no)}
.cbtn.yes{background:var(--yes-soft); color:var(--yes)}
.cbtn:disabled{opacity:.4; cursor:default}
.cbtn.flip{width:58px; background:var(--surface); border:1px solid var(--line); color:var(--ink)}
.undo{justify-self:center; font-size:13px; color:var(--muted); padding:6px 10px; margin-top:4px; border-radius:8px}
.undo:disabled{opacity:.35; cursor:default}
.empty{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:22px; border:1.5px dashed var(--line); border-radius:24px; text-align:left}
.empty h3{font-family:var(--f-display); font-weight:700; font-size:20px; margin:0; line-height:1.2; text-wrap:balance}
.empty p{margin:0; color:var(--muted)}
.empty .row{display:flex; gap:8px; flex-wrap:wrap}

@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

/* ---------- settings sheet ---------- */
.scrim{position:fixed; inset:0; background:rgba(8,12,22,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:640px; max-height:92%; overflow-y:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:18px 16px calc(22px + env(safe-area-inset-bottom, 0px))}
.sheet h2{font-family:var(--f-display); font-weight:700; font-size:20px; margin:0}
.shead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.set{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:10px}
.set label{display:flex; justify-content:space-between; gap:10px; font-weight:600}
.set output{font-family:var(--f-mono); font-size:14px; color:var(--accent); white-space:nowrap}
.set p{margin:4px 0 8px; font-size:14px; color:var(--muted)}
.set input[type=range]{width:100%; accent-color:var(--accent)}
.set textarea{width:100%; min-height:90px; font:13px var(--f-mono); padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical}
.set .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.btn.small{height:40px; padding:0 14px; font-size:14px; border-radius:12px}
.btn.danger{background:var(--no-soft); color:var(--no)}
.preview{font-size:13px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums}

.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:30; max-width:calc(100% - 32px); text-align:center}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
@media (max-width:380px){ .cbtn span{display:none} .stat b{font-size:15px} }

.sync.bad i{background:var(--no)} .sync.bad{color:var(--no)}

</style>
</head>

  tl:[["Simple · факт, звычка",[["dots",[-8,-5,-2,1,4,7]]]],

TOPICS.forEach((t, ti) => {

});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(s){ return esc(s).replace(/\*(.+?)\*/g, "<mark>$1</mark>").replace(/___/g, '<span class="gap"></span>').replace(/\n/g, "<br>"); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function blank(){ return {v:1, epoch:0, updatedAt:0, topics:{}, cards:{}, set:{...DEF_SET}, days:{}}; }
function normalize(s){
  const o = blank();
  if (!s || typeof s !== "object") return o;
  o.epoch = s.epoch || 0; o.updatedAt = s.updatedAt || 0;
  o.topics = s.topics || {}; o.cards = s.cards || {}; o.days = s.days || {};
  o.set = {...DEF_SET, ...(s.set || {})};
  return o;
}

  if (!c || !c.t) return 0;
  const hl = c.h * 3600e3 / S().speed;
  return Math.pow(2, -(Date.now() - c.t) / hl);
}
function learned(c){ return !!c && c.t && c.s >= S().streak; }
function topicOn(id){ return !!(state.topics[id] && state.topics[id].on); }
function tstat(t){
  let l = 0, lr = 0, due = 0;
  for (const x of t.list){
    const c = state.cards[x.id];
    if (!c || !c.t) continue;
    if (learned(c)){ l++; if (recall(c) < DUE) due++; } else lr++;
  }
  const st = state.topics[t.id];
  return {total:t.list.length, learned:l, learning:lr, due, on:!!(st && st.on), started:!!st};
}

// ---------- scheduler ----------
let cur = null, revealed = false, hist = [], undoStack = [], practice = false;

function pick(){
  const set = S(), recent = hist.slice(-3);
  const learning = [], fresh = [], due = [];
  for (const x of ALL){
    if (!topicOn(x.topic)) continue;
    const c = state.cards[x.id];
    if (!c || !c.t){ fresh.push(x); continue; }
    x._r = recall(c);
    if (c.s >= set.streak){ if (x._r < DUE || practice) due.push(x); }
    else learning.push(x);
  }
  const ok = a => { const b = a.filter(x => !recent.includes(x.id)); return b.length ? b : a; };
  const low = a => ok(a).reduce((m, x) => x._r < m._r ? x : m);
  if (practice){
    if (due.length) return {x:low(due), mode:"review"};
    practice = false;
  }
  if (due.length && (Math.random() < set.review || (!learning.length && !fresh.length))) return {x:low(due), mode:"review"};
  const weak = learning.filter(x => x._r < 0.5);
  if (weak.length) return {x:low(weak), mode:"learn"};
  if (fresh.length && learning.length < set.pool) return {x:fresh[0], mode:"new"};
  if (learning.length) return {x:low(learning), mode:"learn"};
  if (due.length) return {x:low(due), mode:"review"};
  return null;
}

function answer(right){
  if (!cur) return;
  const x = cur.x, set = S();
  const prev = state.cards[x.id] ? {...state.cards[x.id]} : null;
  undoStack.push({id:x.id, prev, cur, day:today()});
  if (undoStack.length > 20) undoStack.shift();
  const c = prev ? {...prev} : {h:0, t:0, s:0, n:0, l:0};
  const r = recall(c), wasLearned = learned(c);
  if (right){
    if (!c.t){ c.s = Math.max(1, set.streak - 1); c.h = H_KNOWN; }
    else { c.s += 1; c.h = Math.min(24 * 400, Math.max(c.h, H0) * set.growth * (r < DUE ? 1.3 : 1)); }
  } else {
    if (wasLearned) c.l = (c.l || 0) + 1;
    c.s = 0; c.h = H0;
  }
  c.t = Date.now(); c.n = (c.n || 0) + 1;
  state.cards[x.id] = c;
  state.days[today()] = (state.days[today()] || 0) + 1;
  hist.push(x.id); if (hist.length > 30) hist.shift();
  save();
  if (!wasLearned && learned(c)){
    const t = TOPIC_BY_ID[x.topic], st = tstat(t);
    if (st.learned === st.total) toast("Тэма «" + t.title + "» вывучана!");
    else toast("Вывучана · " + st.learned + "/" + st.total + " у тэме");
  }
  cur = pick(); revealed = false;
  renderCards(); renderBadge();
}

function undo(){
  const u = undoStack.pop(); if (!u) return;
  if (u.prev) state.cards[u.id] = u.prev; else delete state.cards[u.id];
  if (state.days[u.day]) state.days[u.day]--;
  hist.pop();
  cur = u.cur; revealed = true;
  save(); renderCards(); renderBadge();
}

// ---------- persistence & sync ----------
const sync = {ref:null, busy:false, pending:false, timer:0, cloud:false};

function save(){
  state.updatedAt = Date.now();
  lsSet(LSK, JSON.stringify(state));
  clearTimeout(sync.timer);
  sync.timer = setTimeout(push, 1500);
}
async function push(){
  if (!sync.ref) return;
  if (sync.busy){ sync.pending = true; return; }
  sync.busy = true;
  try{ await sync.ref.set(JSON.parse(JSON.stringify(state))); sync.cloud = true; }
  catch(e){ sync.cloud = false; }
  sync.busy = false; renderSync();
  if (sync.pending){ sync.pending = false; push(); }
}
function merge(a, b){
  if ((a.epoch || 0) !== (b.epoch || 0)) return normalize((a.epoch || 0) > (b.epoch || 0) ? a : b);
  const o = blank(), newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  o.epoch = a.epoch || 0;
  o.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  o.set = {...DEF_SET, ...(newer.set || {})};
  const ta = a.topics || {}, tb = b.topics || {};
  for (const k of new Set([...Object.keys(ta), ...Object.keys(tb)])){
    const x = ta[k], y = tb[k];
    o.topics[k] = !x ? y : !y ? x : ((x.at || 0) >= (y.at || 0) ? x : y);
  }
  const ca = a.cards || {}, cb = b.cards || {};
  for (const k of new Set([...Object.keys(ca), ...Object.keys(cb)])){
    const x = ca[k], y = cb[k];
    o.cards[k] = !x ? y : !y ? x : ((x.t || 0) >= (y.t || 0) ? x : y);
  }
  const da = a.days || {}, dbb = b.days || {};
  for (const k of new Set([...Object.keys(da), ...Object.keys(dbb)])) o.days[k] = Math.max(da[k] || 0, dbb[k] || 0);
  return o;
}
async function pull(){
  if (!sync.ref) return;
  try{
    const snap = await sync.ref.get();
    if (snap.exists){
      const remote = snap.data();
      const merged = merge(state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(state);
      state = merged; lsSet(LSK, JSON.stringify(state));
      if (JSON.stringify(merged) !== JSON.stringify(normalize(remote))) push();
      if (changed){ if (cur && !topicOn(cur.x.topic)) cur = null; renderAll(); }
    } else if (state.updatedAt) push();
    sync.cloud = true;
  }catch(e){ sync.cloud = false; }
  renderSync();
}
let tries = 0;
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function"){ if (++tries < 8) setTimeout(connect, 500); return; }
  try{
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    sync.ref = db.doc("data/users/" + uid + "/progress");
    await pull();
  }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ clearTimeout(sync.timer); push(); }
  else { pull(); if (ui.tab === "cards"){ if (!cur) cur = pick(); renderCards(); } renderBadge(); }
});

// ---------- timeline svg ----------
function tlSVG(items){
  const X = v => 170 + v * 15, Y = 46, W = 30;
  let s = '<svg class="tl" viewBox="0 0 340 74" role="img" aria-label="Часавая шкала">';
  s += `<line class="ax" x1="10" y1="${Y}" x2="326" y2="${Y}"/><path class="axh" d="M332 ${Y}l-8 -4.5v9z"/>`;
  s += `<line class="now" x1="170" y1="${Y-9}" x2="170" y2="${Y+9}"/>`;
  s += `<text class="labi" x="170" y="70" text-anchor="middle">цяпер</text><text class="lab" x="10" y="70">мінулае</text><text class="lab" x="330" y="70" text-anchor="end">будучыня</text>`;
  for (const it of items){
    const [k, a, b, lab] = it;
    if (k === "dot"){ s += `<circle class="dot" cx="${X(a)}" cy="${Y}" r="5.5"/>`; if (b) s += `<text class="labi" x="${X(a)}" y="${Y-12}" text-anchor="middle">${esc(b)}</text>`; }
    if (k === "dots"){ for (const v of a) s += `<circle class="dot" cx="${X(v)}" cy="${Y}" r="4.2"/>`; }
    if (k === "wave"){
      let d = "", x0 = X(a), x1 = X(b);
      for (let x = x0; x <= x1 + .01; x += 2) d += (x === x0 ? "M" : "L") + x.toFixed(1) + " " + (W + 4 * Math.sin((x - x0) / 4)).toFixed(1);
      s += `<path class="wave" d="${d}"/>`;
      if (it[3]) s += `<text class="labi" x="${(x0+x1)/2}" y="${W-10}" text-anchor="middle">${esc(it[3])}</text>`;
    }
    if (k === "arrow"){
      const x0 = X(a), x1 = X(b);
      s += `<path class="arr" d="M${x0} ${Y-6} Q ${(x0+x1)/2} ${W-6} ${x1-4} ${Y-8}"/><path class="arrh" d="M${x1} ${Y-5}l-8 -1.5 3.5 -6z"/>`;
      if (it[3]) s += `<text class="labi" x="${(x0+x1)/2}" y="${W-12}" text-anchor="middle">${esc(it[3])}</text>`;
    }
    if (k === "ref"){
      s += `<line class="ref" x1="${X(a)}" y1="14" x2="${X(a)}" y2="${Y+8}"/>`;
      if (b) s += `<text class="labi" x="${X(a)}" y="10" text-anchor="middle">${esc(b)}</text>`;
    }
  }
  return s + "</svg>";
}

// ---------- render: topics ----------
function nextTopic(){ return TOPICS.find(t => !state.topics[t.id]); }

function statusPill(st){
  if (!st.started) return '<span class="pill">Не пачата</span>';
  if (!st.on) return '<span class="pill paused">На паўзе</span>';
  if (st.learned === st.total) return st.due ? `<span class="pill due">Паўтор ${st.due}</span>` : '<span class="pill done">Вывучана</span>';
  return `<span class="pill on">${Math.round(st.learned / st.total * 100)}%</span>`;
}

function renderTopics(){
  const v = $("#v-topics");
  if (ui.topic && TOPIC_BY_ID[ui.topic]) return renderDetail(TOPIC_BY_ID[ui.topic]);
  const nx = nextTopic();
  let h = '<div class="pad">';
  const active = TOPICS.filter(t => topicOn(t.id));
  h += `<div class="h-sec">${active.length ? "Тэмы · актыўных у картачках: " + active.length : "Тэмы · выберы, з чаго пачаць"}</div><div class="tlist">`;
  for (const t of TOPICS){
    const st = tstat(t);
    const pct = st.started ? Math.round(st.learned / st.total * 100) : 0;
    h += `<button class="titem${t === nx ? " next" : ""}" data-topic="${t.id}">
      <span class="tnum">${String(t.num).padStart(2, "0")}</span>
      <span class="tbody"><span class="tname">${esc(t.title)}</span><span class="tsub" style="display:block">${esc(t.sub)}${t === nx ? " · наступная" : ""}</span>
      ${st.started ? `<span class="tbar"><b style="width:${pct}%"></b></span>` : ""}</span>
      ${statusPill(st)}</button>`;
  }
  h += "</div></div>";
  v.innerHTML = h;
  v.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { ui.topic = b.dataset.topic; saveUI(); renderTopics(); v.scrollTop = 0; });
}

function renderDetail(t){
  const v = $("#v-topics"), st = tstat(t);
  let h = `<div class="pad"><button class="back" id="back">${ICON.back} Усе тэмы</button>
    <div class="dhead"><div class="dnum">ТЭМА ${String(t.num).padStart(2,"0")} · ${st.total} КАРТАЧАК</div>
    <h1 class="dtitle">${esc(t.title)}</h1><p class="dsub">${esc(t.sub)}</p></div>`;
  if (t.intro) h += `<p class="intro">${fmt(t.intro)}</p>`;
  if (t.tl) for (const [cap, items] of t.tl) h += `<div class="tlbox"><div class="tlcap">${esc(cap)}</div>${tlSVG(items)}</div>`;
  for (const tb of (t.tables || [])){
    h += `<div class="tblcap">${esc(tb.cap)}</div><div class="tblwrap"><table><thead><tr>${tb.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>`;
    h += tb.rows.map(r => "<tr>" + r.map(c => `<td>${fmt(c)}</td>`).join("") + "</tr>").join("");
    h += "</tbody></table></div>";
  }
  if (t.uses && t.uses.length){
    h += '<div class="h-sec">Калі ўжываем</div><div class="uses">';
    for (const [u, en, be] of t.uses) h += `<div class="use"><div class="u">${esc(u)}</div><div class="en">${fmt(en)}</div>${be ? `<div class="be">${fmt(be)}</div>` : ""}</div>`;
    h += "</div>";
  }
  if (t.markers && t.markers.length){
    h += '<div class="h-sec">Словы-маркеры</div><div class="chips">' + t.markers.map(m => `<span class="chip">${esc(m)}</span>`).join("") + "</div>";
  }
  if (t.mistakes && t.mistakes.length){
    h += '<div class="h-sec">Тыповыя памылкі</div><div class="mist">';
    for (const [w, r, why] of t.mistakes) h += `<div class="mis"><div class="w">${mini("no")}<span>${esc(w)}</span></div><div class="r">${mini("yes")}<span>${fmt(r)}</span></div>${why ? `<div class="why">${esc(why)}</div>` : ""}</div>`;
    h += "</div>";
  }
  h += `<div class="h-sec">Картачкі тэмы</div><div class="dcards">`;
  for (const x of t.list){
    const c = state.cards[x.id], done = learned(c), s = c && c.t ? Math.min(c.s, S().streak) : 0;
    let dots = ""; for (let i = 0; i < S().streak; i++) dots += `<i class="${i < s ? "f" : ""}"></i>`;
    h += `<div class="dcard"><div><div class="k">${KIND[x.k]}</div>${fmt(x.f)}</div><div class="meter${done ? " done" : ""}" title="${done ? "вывучана" : "прагрэс"}">${dots}</div></div>`;
  }
  h += "</div>";
  // action bar
  h += '<div class="actbar">';
  if (!st.started) h += `<button class="btn primary" id="act-start">Дадаць у картачкі · ${st.total}</button>`;
  else if (!st.on) h += `<button class="btn primary" id="act-on">Вярнуць у картачкі</button>`;
  else {
    h += `<button class="btn primary" id="act-go">${st.learned === st.total ? "Вывучана · паўтарыць" : "Вучыць · " + st.learned + "/" + st.total}</button>`;
    h += `<button class="btn ghost" id="act-off">Паўза</button>`;
  }
  h += "</div></div>";
  v.innerHTML = h;
  $("#back").onclick = () => { ui.topic = null; saveUI(); renderTopics(); };
  const setOn = on => { state.topics[t.id] = {on, at:Date.now()}; practice = false; save(); cur = null; renderDetail(t); renderBadge(); };
  if ($("#act-start")) $("#act-start").onclick = () => { setOn(true); toast("Картачкі тэмы дададзены"); };
  if ($("#act-on")) $("#act-on").onclick = () => setOn(true);
  if ($("#act-off")) $("#act-off").onclick = () => setOn(false);
  if ($("#act-go")) $("#act-go").onclick = () => { if (st.learned === st.total) practice = true; cur = null; setTab("cards"); };
}

// ---------- render: cards ----------
function renderCards(){
  const v = $("#v-cards");
  let learning = 0, lr = 0, due = 0, total = 0;
  for (const x of ALL){
    if (!state.topics[x.topic]) continue;
    total++;
    const c = state.cards[x.id];
    if (!c || !c.t) continue;
    if (learned(c)){ lr++; if (recall(c) < DUE && topicOn(x.topic)) due++; }
    else if (topicOn(x.topic)) learning++;
  }
  const td = state.days[today()] || 0;
  let h = `<div class="cview"><div class="stats">
    <div class="stat"><b>${td}</b><span>сёння</span></div>
    <div class="stat"><b>${learning}</b><span>у працы</span></div>
    <div class="stat"><b>${due}</b><span>да паўтору</span></div>

  } else {

        <div class="row">${nx ? `<button class="btn primary" id="e-next">Адкрыць «${esc(nx.title)}»</button>` : ""}<button class="btn ghost" id="e-practice">Паўтарыць слабыя</button></div></div>`;
    } else {
      const x = cur.x, c = state.cards[x.id], t = TOPIC_BY_ID[x.topic];
      const s = c && c.t ? Math.min(c.s, S().streak) : 0;
      let dots = ""; for (let i = 0; i < S().streak; i++) dots += `<i class="${i < s ? "f" : ""}"></i>`;
      const modeTxt = cur.mode === "new" ? "новая" : cur.mode === "review" ? "паўтор" : "вывучаецца";
      h += `<div class="card under" aria-hidden="true"></div>

          <div class="stamp yes" id="st-yes">ВЕДАЮ</div><div class="stamp no" id="st-no">НЕ ВЕДАЮ</div>
          <div class="chead"><span class="kind">${KIND[x.k]}</span><span class="mode ${cur.mode}">${modeTxt}</span><span class="ctopic">${esc(t.title)}</span></div>
          <div class="cbody"><div class="prompt">${fmt(x.f)}</div>
            <div class="ans"><div class="a">${fmt(x.a)}</div>${x.n ? `<div class="n">${fmt(x.n)}</div>` : ""}</div></div>
          <div class="cfoot"><span>${revealed ? "Свайп: управа ведаю, улева не" : "Націсні, каб убачыць адказ"}</span><span class="meter" title="правільных запар">${dots}</span></div>
        </div>`;
    }
  }
  h += "</div>";
  const has = !!cur;
  h += `<div class="controls">

      <button class="cbtn flip" id="b-flip" aria-label="Паказаць адказ" ${has ? "" : "disabled"}>${ICON.eye}</button>
      <button class="cbtn yes" id="b-yes" ${has ? "" : "disabled"}>${ICON.yes}<span>Ведаю</span></button></div>
    <button class="undo" id="b-undo" ${undoStack.length ? "" : "disabled"}>Адмяніць апошні свайп</button></div>`;
  v.innerHTML = h;
  if ($("#e-start")) $("#e-start").onclick = () => { const nx = nextTopic() || TOPICS[0]; state.topics[nx.id] = {on:true, at:Date.now()}; save(); cur = null; renderAll(); };
  if ($("#e-topics")) $("#e-topics").onclick = () => setTab("topics");
  if ($("#e-next")) $("#e-next").onclick = () => { ui.topic = nextTopic().id; setTab("topics"); };
  if ($("#e-practice")) $("#e-practice").onclick = () => { practice = true; cur = pick(); if (!cur) toast("Пакуль няма вывучаных картачак"); renderCards(); };

function toggleReveal(){
  revealed = !revealed;
  const el = $("#card"); if (!el) return;
  el.classList.toggle("revealed", revealed);
  el.querySelector(".cfoot span").textContent = revealed ? "Свайп: управа ведаю, улева не" : "Націсні, каб убачыць адказ";
}

let flying = false;
function fly(right){
  const el = $("#card"); if (!el || flying) return;
  flying = true;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#st-" + (right ? "yes" : "no")).style.opacity = 1;
  el.style.transition = "transform .24s ease-in, opacity .24s ease-in";
  el.style.transform = `translate(${right ? 130 : -130}%, 20px) rotate(${right ? 16 : -16}deg)`;
  el.style.opacity = "0";
  setTimeout(() => { flying = false; answer(right); }, reduce ? 0 : 200);
}

function bindSwipe(el){
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false, pid = null;
  const yes = $("#st-yes"), no = $("#st-no");
  el.addEventListener("pointerdown", e => {
    if (e.button > 0 || flying) return;
    down = true; moved = false; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    el.style.transition = "none";
  });
  el.addEventListener("pointermove", e => {
    if (!down || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ moved = true; try{ el.setPointerCapture(pid); }catch(_){} }
    if (moved){
      el.style.transform = `translate(${dx}px, ${dy * .15}px) rotate(${dx / 18}deg)`;
      yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
      no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    }
  });
  const reset = () => { el.style.transition = ""; el.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; };
  el.addEventListener("pointerup", e => {
    if (!down) return; down = false;
    if (moved){ if (Math.abs(dx) > 90) fly(dx > 0); else reset(); }
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8){ reset(); toggleReveal(); }
  });
  el.addEventListener("pointercancel", () => { down = false; reset(); });
}

// ---------- tabs, badge, sync label ----------
function setTab(tab){
  ui.tab = tab; saveUI();
  $("#v-topics").hidden = tab !== "topics";
  $("#v-cards").hidden = tab !== "cards";
  $("#tab-topics").setAttribute("aria-selected", tab === "topics");
  $("#tab-cards").setAttribute("aria-selected", tab === "cards");
  if (tab === "cards") renderCards(); else renderTopics();
}
function renderBadge(){
  let n = 0;
  for (const x of ALL){
    if (!topicOn(x.topic)) continue;
    const c = state.cards[x.id];
    if (!c || !c.t || !learned(c) || recall(c) < DUE) n++;
  }
  const b = $("#badge"); b.hidden = !n; b.textContent = n > 99 ? "99+" : n;
}
function renderSync(){
  const el = $("#sync");
  el.classList.toggle("cloud", sync.cloud);
  el.querySelector("span").textContent = STORAGE_OK ? "офлайн" : "не захоўваецца";
  el.classList.toggle("bad", !STORAGE_OK);
  el.title = STORAGE_OK ? "Прагрэс захоўваецца ў гэтым браўзеры на прыладзе" : "Браўзер не дазваляе захоўваць дадзеныя. Рабі копію прагрэсу файлам у наладах.";
}
function saveUI(){ lsSet(LS_UI, JSON.stringify(ui)); }
function renderAll(){ if (ui.tab === "cards") renderCards(); else renderTopics(); renderBadge(); renderSync(); }

$("#tab-topics").onclick = () => { if (ui.tab === "topics" && ui.topic){ ui.topic = null; saveUI(); renderTopics(); } else setTab("topics"); };
$("#tab-cards").onclick = () => setTab("cards");

document.addEventListener("keydown", e => {
  if (ui.tab !== "cards" || !$("#scrim").hidden || !cur) return;
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); fly(true); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); fly(false); }
  else if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown"){ e.preventDefault(); toggleReveal(); }
  else if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)){ e.preventDefault(); undo(); }
});

// ---------- settings ----------
function fmtH(h){
  if (h < 1) return Math.round(h * 60) + " хв";
  if (h < 48) return (Math.round(h * 10) / 10) + " гадз";
  return Math.round(h / 24) + " дз";
}
function schedulePreview(){
  // how long until each review after learning, with the current settings
  const set = S(); let h = H0, out = [];
  for (let i = 0; i < set.streak; i++) h = Math.max(h, H0) * set.growth;
  for (let i = 0; i < 5; i++){ out.push(fmtH(h / set.speed)); h *= set.growth; }
  return "Паўторы пасля вывучэння прыкладна праз: " + out.join(" → ");
}
function openSettings(){
  const set = S(), sc = $("#scrim");
  sc.hidden = false;
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Налады">
    <div class="shead"><h2>Налады</h2><button class="iconbtn" id="s-close" aria-label="Закрыць">${ICON.x}</button></div>
    <div class="set"><label for="s-speed">Хуткасць забывання <output id="o-speed"></output></label>
      <p>Як хутка «пратухаюць» картачкі. Больш — часцей вяртаюцца на паўтор.</p>
      <input type="range" id="s-speed" min="0.25" max="3" step="0.25" value="${set.speed}">
      <div class="preview" id="s-prev"></div></div>
    <div class="set"><label for="s-growth">Рост інтэрвалу <output id="o-growth"></output></label>
      <p>У колькі разоў падаўжаецца памяць пасля кожнага «ведаю».</p>
      <input type="range" id="s-growth" min="1.5" max="4" step="0.1" value="${set.growth}"></div>
    <div class="set"><label for="s-streak">«Ведаю» запар, каб лічыць вывучаным <output id="o-streak"></output></label>
      <p>Пасля «не ведаю» лічыльнік скідваецца на нуль.</p>
      <input type="range" id="s-streak" min="2" max="6" step="1" value="${set.streak}"></div>
    <div class="set"><label for="s-pool">Новых картачак адначасова <output id="o-pool"></output></label>
      <p>Колькі невывучаных картачак круціцца ў калодзе. Новая дадаецца, калі нейкая вывучана.</p>
      <input type="range" id="s-pool" min="3" max="20" step="1" value="${set.pool}"></div>
    <div class="set"><label for="s-review">Доля паўтораў старога <output id="o-review"></output></label>
      <p>Як часта сярод новага трапляюцца картачкі, якім пара на паўтор.</p>
      <input type="range" id="s-review" min="0" max="0.6" step="0.05" value="${set.review}"></div>
    <div class="set"><label>Захаванне</label>
      <p id="s-sync"></p>
      <div class="row"><button class="btn ghost small" id="s-file">Захаваць копію файлам</button><button class="btn ghost small" id="s-open">Загрузіць з файла</button><input type="file" id="s-fileinp" accept=".json,application/json,text/plain" hidden></div>
      <div class="row"><button class="btn ghost small" id="s-export">Скапіяваць тэкстам</button><button class="btn ghost small" id="s-import">Уставіць тэкст</button></div>
      <textarea id="s-data" placeholder="Сюды ўстаў скапіяваную копію прагрэсу і націсні «Уставіць копію»" hidden></textarea></div>
    <div class="set"><label>Скінуць увесь прагрэс</label><p>Усе картачкі і тэмы пачнуцца нанова. Налады застануцца.</p>
      <div class="row"><button class="btn danger small" id="s-reset">Скінуць прагрэс</button><button class="btn ghost small" id="s-defaults">Налады па змаўчанні</button></div></div>
  </div>`;
  const bind = (id, key, show) => {
    const inp = $("#s-" + id), out = $("#o-" + id);
    const upd = () => { out.textContent = show(+inp.value); $("#s-prev").textContent = schedulePreview(); };
    inp.oninput = () => { state.set[key] = +inp.value; upd(); };
    inp.onchange = () => { save(); cur = null; };
    upd();
  };
  bind("speed", "speed", v => v === 1 ? "×1 (норма)" : "×" + v);
  bind("growth", "growth", v => "×" + v.toFixed(1));
  bind("streak", "streak", v => v);
  bind("pool", "pool", v => v);
  bind("review", "review", v => Math.round(v * 100) + "%");
  $("#s-sync").textContent = STORAGE_OK ? "Прагрэс захоўваецца ў гэтым браўзеры на гэтай прыладзе. Каб перанесці яго на іншы тэлефон ці ў онлайн-версію, захавай копію файлам або скапіюй тэкстам і ўстаў там." : "Гэты браўзер не захоўвае дадзеныя старонкі, прагрэс знікне пасля закрыцця. Адкрый файл у Chrome ці Safari або рабі копію файлам.";
  $("#s-file").onclick = () => {
    const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "kartachki-progress-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Файл захаваны");
  };
  $("#s-open").onclick = () => $("#s-fileinp").click();
  $("#s-fileinp").onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const ta = $("#s-data"); ta.hidden = false; ta.value = r.result; $("#s-import").click(); };
    r.readAsText(f);
  };
  $("#s-close").onclick = closeSettings;
  sc.onclick = e => { if (e.target === sc) closeSettings(); };
  $("#s-export").onclick = () => {
    const txt = JSON.stringify(state), ta = $("#s-data");
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.select(); toast("Вылучана, скапіюй уручную"); };
    try{ navigator.clipboard.writeText(txt).then(() => toast("Скапіявана"), fallback); }catch(e){ fallback(); }
  };
  $("#s-import").onclick = () => {
    const ta = $("#s-data");
    if (ta.hidden || !ta.value.trim()){ ta.hidden = false; ta.value = ""; ta.focus(); toast("Устаў копію ў поле"); return; }
    try{
      const s = normalize(JSON.parse(ta.value));
      s.epoch = Date.now(); s.updatedAt = Date.now();
      state = s; lsSet(LSK, JSON.stringify(state)); push(); cur = null; undoStack = [];
      toast("Прагрэс адноўлены"); closeSettings();
    }catch(e){ toast("Не атрымалася прачытаць копію. Праверце, што ўстаўлены ўвесь тэкст."); }
  };
  let armed = false;
  $("#s-reset").onclick = e => {
    if (!armed){ armed = true; e.currentTarget.textContent = "Націсні яшчэ раз, каб пацвердзіць"; return; }
    const set = {...state.set};
    state = blank(); state.set = set; state.epoch = Date.now(); state.updatedAt = Date.now();
    lsSet(LSK, JSON.stringify(state)); push(); cur = null; undoStack = []; hist = [];
    toast("Прагрэс скінуты"); closeSettings();
  };
  $("#s-defaults").onclick = () => { state.set = {...DEF_SET}; save(); cur = null; openSettings(); toast("Налады скінуты"); };
}
function closeSettings(){ const sc = $("#scrim"); sc.hidden = true; sc.innerHTML = ""; renderAll(); }
$("#gear").onclick = openSettings;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scrim").hidden) closeSettings(); });

// ---------- boot ----------
setTab(ui.tab === "cards" ? "cards" : "topics");
renderBadge(); renderSync();

</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
